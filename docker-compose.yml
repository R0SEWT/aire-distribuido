# Despliegue reproducible del sistema (spec de la PC4, §8, y del frontend, §11):
# la UI, la API coordinadora, los nodos de cómputo, MongoDB y Redis.
#
#   cp .env.example .env                 # y completar JWT_SECRETO y API_USUARIOS
#   docker compose up --build            # UI en http://localhost:8081, API en http://localhost:8080/docs
#   docker compose up --build --scale nodo=3
#
# El gold (data/gold/oefa_features.csv, o la carpeta de GOLD_DIR) no se versiona
# ni va en la imagen: se monta de solo lectura en la API y en los nodos.
#
# Las bases no tienen autenticación y solo publican su puerto en localhost: es
# un entorno de desarrollo (docs/datos/README.md).

services:
  api:
    build: .
    image: aire-distribuido
    # -cola es el búfer de cada cola de escritura (una por base). Con el valor
    # por omisión, 1024, una ráfaga de 20 000 predicciones llegó a perder un
    # tercio en MongoDB; con 32768 no perdió ninguna. Son unos 10 MB.
    #
    # La API es también el coordinador del clúster: los nodos la llaman en el
    # 7070 (-nodos-addr), que no se publica al anfitrión porque solo lo usan
    # los nodos de esta red. Para entrenar necesita el mismo gold que ellos.
    #
    # -jwt-duracion es lo que dura un token. No se renueva: al vencer, la UI
    # vuelve al ingreso. Una hora por omisión; para una demo larga se sube con
    # JWT_DURACION en .env (por ejemplo 4h).
    command: ["api", "-addr", ":8080", "-cola", "32768", "-nodos-addr", ":7070", "-gold", "/datos/gold/oefa_features.csv",
              "-jwt-duracion", "${JWT_DURACION:-1h}"]
    expose:
      - "7070"
    volumes:
      - ${GOLD_DIR:-./data/gold}:/datos/gold:ro
    # Al apagar, la API corta el entrenamiento en curso y despide a los nodos
    # antes de terminar los pedidos y vaciar las colas: se le da margen.
    stop_grace_period: 20s
    environment:
      # Sin valor, la API no arranca y dice cuál falta (docker compose logs api).
      JWT_SECRETO: ${JWT_SECRETO:-}
      API_USUARIOS: ${API_USUARIOS:-}
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: aire_distribuido
      REDIS_ADDR: redis:6379
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    # La imagen es distroless, sin shell ni curl: el healthcheck es la propia
    # API, que pide su /api/salud y sale con 0 o 1.
    healthcheck:
      test: ["CMD", "api", "-salud"]
      interval: 5s
      timeout: 4s
      retries: 6
      start_period: 5s

  # La UI (spec del frontend, §11): un solo Caddy que sirve la SPA ya compilada y
  # pasa /api, /ws, /docs y /openapi.yaml a la API, con las cabeceras de
  # seguridad de web/Caddyfile. La UI y la API quedan en el mismo origen: sin
  # CORS. Publicado solo en localhost, como todo lo demás.
  web:
    build: ./web
    image: aire-distribuido-web
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy

  # Un nodo de cómputo. Sin container_name ni puertos: solo abre la conexión de
  # salida hacia el coordinador, así que se escala con --scale nodo=K y cada
  # réplica se presenta con el nombre de su contenedor más su PID. Si el
  # coordinador no escucha o cierra la corrida, vuelve a llamar a los dos segundos.
  nodo:
    build: .
    image: aire-distribuido
    command: ["nodo", "-coordinador", "api:7070", "-gold", "/datos/gold/oefa_features.csv"]
    # El gold no se versiona ni va en la imagen: se monta de solo lectura.
    volumes:
      - ${GOLD_DIR:-./data/gold}:/datos/gold:ro
    depends_on:
      api:
        condition: service_healthy
    # cmd/nodo se detiene en orden con Ctrl+C (SIGINT).
    stop_signal: SIGINT

  mongo:
    image: mongo:8.0.38
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Crea las colecciones y los índices y carga la ficha de estaciones. Corre en
  # cada «up» contra el MongoDB ya sano y termina; la API espera a que salga con
  # 0. Es idempotente: si falla (una ficha mal formada), se corrige la ficha y
  # se vuelve a levantar, sin borrar el volumen.
  seed:
    image: mongo:8.0.38
    entrypoint: ["mongosh"]
    command: ["--quiet", "mongodb://mongo:27017/aire_distribuido", "--file", "/seed/seed.js"]
    environment:
      MONGO_INITDB_DATABASE: aire_distribuido
      ESTACIONES_CSV: /seed/estaciones_ficha.csv
    volumes:
      - ./docs/datos/seed.js:/seed/seed.js:ro
      - ./reports/estaciones_ficha.csv:/seed/estaciones_ficha.csv:ro
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7.4.12-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    # -e: sin él, redis-cli sale con 0 aunque Redis responda un error (por
    # ejemplo LOADING mientras lee el AOF).
    healthcheck:
      test: ["CMD", "redis-cli", "-e", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  mongo_data:
  redis_data:
