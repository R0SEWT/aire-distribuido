# Informe de la PC3 (Entregable 1 del Trabajo Final) en Quarto → Word.
# Cómo se renderiza: README.md. Corto: `bash render.sh` deja los tres .docx en salida/.
project:
  type: default
  output-dir: salida
  render:
    - informe.qmd
    - participacion.qmd

# Motor markdown: el .qmd no tiene celdas ejecutables. Las tablas y cifras se generan antes, con
# tablas.py (generado/tablas/*.md y generado/cifras.yml), y se incluyen. Así renderizar no depende
# de un kernel de Python y las cifras del informe salen siempre de los JSON que escribe Go.
engine: markdown

lang: es
bibliography: referencias.bib
csl: apa.csl
link-citations: true
number-sections: true
fig-cap-location: top
tbl-cap-location: top
crossref:
  fig-title: Figura
  tbl-title: Tabla
  title-delim: "."
metadata-files:
  - generado/cifras.yml
filters:
  - filtros/informe.lua

# Parámetro del render: el código de quien sube el archivo (cambia la carátula).
#   quarto render informe.qmd -M codigo:U202311495
# render.sh lo hace para los tres. Por defecto, el del coordinador.
codigo: U202216562
equipo:
  - nombre: Rody Sebastian Vilchez Marin
    codigo: U202216562
    rol: coordinador
  - nombre: Dayana Kety Gómez Rodriguez
    codigo: U202311495
  - nombre: Julio Cesar Meza Alfaro
    codigo: U202218912
indice-titulo: Índice
indice-niveles: "1-3"

format:
  docx:
    reference-doc: recursos/plantilla.docx
    # El índice no lo pone Pandoc (toc: true lo dejaría antes de la carátula): lo pone el filtro
    # donde está `::: indice` en informe.qmd, después del resumen, como ordena el enunciado.
    toc: false
    number-sections: true
    highlight-style: github
