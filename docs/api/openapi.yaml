openapi: 3.0.3
info:
  title: API coordinadora de aire-distribuido
  version: 0.1.0
  description: |
    Contrato de la API de la PC4 (spec §6, PR #51). Coordina el K-Means distribuido
    y asigna cada lectura horaria a un régimen del modelo activo.

    Los ejemplos salen de la spec §6.5 y de reports/regimenes.json.
servers:
  - url: /
    description: El mismo origen que sirve este contrato (la API local, la de Docker Compose o una desplegada)
tags:
  - name: Autenticación
  - name: Salud
  - name: Predicciones
  - name: Estaciones
  - name: Modelos
  - name: Clúster
  - name: Entrenamientos
  - name: Métricas
  - name: Documentación
  - name: Eventos
security:
  - bearerAuth: []
paths:
  /api/auth/token:
    post:
      tags: [Autenticación]
      operationId: crearToken
      summary: Obtiene un JWT HS256 para un usuario de demostración
      description: Las credenciales y el rol se configuran en el servidor. El ejemplo demo/demo corresponde al rol usuario.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Credenciales'}
            example: {usuario: demo, clave: demo}
      responses:
        '200':
          description: Token con expiración y rol. El token de ejemplo no es una credencial utilizable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Token'}
              example:
                token: '<token>'
                rol: usuario
                expira: '2026-11-21T23:30:00-05:00'
        '400': {$ref: '#/components/responses/PedidoInvalido'}
        '401':
          description: Usuario o clave incorrectos
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: usuario o clave incorrectos}
  /api/auth/invitado:
    post:
      tags: [Autenticación]
      operationId: ingresarComoInvitado
      summary: Obtiene un JWT de la cuenta de invitado, sin credenciales, si el servidor la habilitó
      description: |
        El pedido no lleva cuerpo. La cuenta de invitado es un usuario de rol usuario que designa
        quien levanta la API (variable de entorno API_INVITADO); su clave no sale del servidor.
        La respuesta tiene la misma forma que la de POST /api/auth/token y el token vale lo mismo:
        con él se puede todo lo del rol usuario, también POST /api/predicciones.
        Si el servidor no designó una cuenta de invitado, responde 404.
      security: []
      responses:
        '200':
          description: Token de la cuenta de invitado, con expiración y rol. El token de ejemplo no es una credencial utilizable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Token'}
              example:
                token: '<token>'
                rol: usuario
                expira: '2026-11-21T23:30:00-05:00'
        '404':
          description: El servidor no tiene habilitado el ingreso de invitado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: el ingreso de invitado no está habilitado}
  /api/salud:
    get:
      tags: [Salud]
      operationId: consultarSalud
      summary: Consulta la API, sus almacenes, el pool y el modelo activo
      security: []
      responses:
        '200':
          description: Estado de los componentes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Salud'}
              example: {api: ok, mongo: ok, redis: ok, nodos_en_pool: 4, modelo_activo: sembrado-kmeans-json}
  /api/predicciones:
    post:
      tags: [Predicciones]
      operationId: predecirRegimen
      summary: Asigna una lectura al régimen más cercano del modelo activo
      description: |
        Rol usuario o admin. La lectura llega en µg/m³, sin estandarizar.
        El servidor aplica la receta y la estandarización del modelo activo.
        La estación tiene que estar en el catálogo, que la API tiene en memoria: el
        camino del pedido no consulta ninguna base (spec §6.2). La fecha_hora se
        trunca a la hora: hay una lectura por estación y hora, y repetirla la reemplaza.
      x-roles: [usuario, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Lectura'}
            example: {estacion: CA-AYAS-01, fecha_hora: '2026-11-14T15:00:00-05:00', pm2_5: 70.2, pm10: 190.5}
      responses:
        '200':
          description: Régimen del modelo activo y, aparte, la media de 24 h de la estación frente al ECA y al INCA
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Prediccion'}
              example:
                estacion: CA-AYAS-01
                regimen: 1
                excede_eca: true
                media_24h: {pm2_5: 58.3, pm10: 121.4, lecturas: 24}
                alerta: true
                inca: mala
                pm2_5_medio_regimen: 65.1
                pm10_medio_regimen: 186.7
                modelo_id: sembrado-kmeans-json
                ms: 0.04
        '400':
          description: JSON, estación, fecha o concentraciones inválidos
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                negativo: {value: {error: pm2_5 tiene que ser un número no negativo}}
                fuera_de_rango: {value: {error: 'pm10 no puede superar 10000 µg/m³'}}
                estacion: {value: {error: 'estación desconocida: CA-XX-99'}}
                fecha_futura: {value: {error: fecha_hora no puede estar más de 1 hora adelante de la hora del servidor}}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '503':
          description: No hay modelo activo
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: no hay modelo activo}
  /api/estaciones:
    get:
      tags: [Estaciones]
      operationId: listarEstaciones
      summary: Lista las estaciones almacenadas en MongoDB
      x-roles: [usuario, admin]
      responses:
        '200':
          description: Estaciones; una lista vacía es válida
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Estacion'}
              example:
                - {id: CA-AYAS-01, objeto_fiscalizado: Unidad minera Antamina, tipo_actividad: minería,
                   departamento: ANCASH, provincia: HUARI, distrito: SAN MARCOS, lat: -9.52384, lon: -77.02043}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '503': {$ref: '#/components/responses/NoDisponible'}
  /api/estaciones/{id}/regimen:
    parameters:
      - $ref: '#/components/parameters/EstacionId'
    get:
      tags: [Estaciones]
      operationId: consultarRegimenEstacion
      summary: Obtiene de Redis el último régimen registrado de una estación
      x-roles: [usuario, admin]
      responses:
        '200':
          description: Último régimen y momento de actualización
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RegimenEstacion'}
              example: {fecha_hora: '2026-11-14T15:00:00-05:00', regimen: 1, excede_eca: true,
                        media_24h: {pm2_5: 58.3, pm10: 121.4, lecturas: 24},
                        alerta: true, inca: mala, ts: '2026-11-14T15:00:02-05:00'}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '404':
          description: La estación no existe, o existe pero todavía no tiene una predicción registrada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                desconocida: {value: {error: 'estación desconocida: CA-XX-99'}}
                sin_regimen: {value: {error: 'la estación CA-AYAS-01 todavía no tiene un régimen registrado'}}
        '503': {$ref: '#/components/responses/NoDisponible'}
  /api/regimenes:
    get:
      tags: [Estaciones]
      operationId: listarRegimenes
      summary: Obtiene de Redis el último estado de todas las estaciones que tienen uno
      description: |
        Rol usuario o admin. Es GET /api/estaciones/{id}/regimen para todo el
        catálogo en un solo pedido (y una sola ida a Redis): lo que el panel
        necesita al abrir. Trae una entrada por estación que ya tiene una
        predicción registrada, ordenadas por estacion; las que todavía no
        tienen ninguna no aparecen. Con el sistema recién levantado la lista
        está vacía: es un 200, no un 404. Si el valor guardado de una estación
        no se puede leer, esa estación no aparece (queda en el log del
        servidor) y las demás sí: no es un 503.

        El panel se mantiene al día con el evento estacion.regimen de /ws, que
        lleva el mismo objeto. Cómo juntar esta respuesta con los eventos, sin
        que una pise a un evento más nuevo, está en la descripción de /ws.
      x-roles: [usuario, admin]
      responses:
        '200':
          description: El estado de cada estación que tiene uno; una lista vacía es válida
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/EstadoEstacion'}
              example:
                - {estacion: CA-AYAS-01, fecha_hora: '2026-11-14T15:00:00-05:00', regimen: 1, excede_eca: true,
                   media_24h: {pm2_5: 58.3, pm10: 121.4, lecturas: 24},
                   alerta: true, inca: mala, ts: '2026-11-14T15:00:02-05:00'}
                - {estacion: CA-MAC-01, fecha_hora: '2026-11-14T15:00:00-05:00', regimen: 0, excede_eca: false,
                   media_24h: {pm2_5: null, pm10: null, lecturas: 3},
                   alerta: false, inca: null, ts: '2026-11-14T15:00:03-05:00'}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '503': {$ref: '#/components/responses/NoDisponible'}
  /api/modelos/activo:
    get:
      tags: [Modelos]
      operationId: consultarModeloActivo
      summary: Consulta el modelo activo y sus regímenes en unidades originales
      description: El modelo se siembra al arrancar desde reports o la caché. Los índices de régimen no implican orden de gravedad.
      x-roles: [usuario, admin]
      responses:
        '200':
          description: Modelo usado por las predicciones
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Modelo'}
              example:
                id: sembrado-kmeans-json
                k: 3
                features: [pm2_5, pm10]
                iteraciones: 44
                inercia: 50950.37
                regimenes:
                  - {regimen: 0, pm2_5_medio: 9.0, pm10_medio: 17.6, excede_eca: false, tamano: 48161}
                  - {regimen: 1, pm2_5_medio: 65.1, pm10_medio: 186.7, excede_eca: true, tamano: 1536}
                  - {regimen: 2, pm2_5_medio: 24.4, pm10_medio: 58.2, excede_eca: false, tamano: 16176}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '503': {$ref: '#/components/responses/NoDisponible'}
  /api/cluster/nodos:
    get:
      tags: [Clúster]
      operationId: listarNodos
      summary: Lista nodos, workers, latencia y disponibilidad del pool
      x-roles: [admin]
      responses:
        '200':
          description: Nodos conocidos por el coordinador
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Nodo'}
              example: [{nombre: H45-022, direccion: '10.11.38.69:56455', workers: 24, latencia_ms: 0.49, libre: true}]
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/SinPermiso'}
  /api/cluster/eventos:
    get:
      tags: [Clúster]
      operationId: listarEventosCluster
      summary: Lista los eventos del clúster, del más reciente al más antiguo
      description: |
        Rol admin. Son los «logs» del clúster, lo que MongoDB guarda en
        eventos_cluster: un nodo que entró al pool (alta), que salió (baja) o
        que no llegó a entrar o hizo abortar una corrida (error). Los latidos
        no se guardan.

        Después de cada entrenamiento es normal ver una baja y un alta por
        nodo: el nodo deja el pool al cerrar la corrida y vuelve a llamar a la
        API tras su pausa entre intentos (unos 2 s).

        Trae a lo sumo limite eventos (50 si no se indica; 200 como máximo).
        Entre dos del mismo instante, primero el que se guardó último.
      x-roles: [admin]
      parameters:
        - name: limite
          in: query
          required: false
          description: Cuántos eventos traer, a lo sumo
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
          example: 50
      responses:
        '200':
          description: Eventos, del más reciente al más antiguo; una lista vacía es válida
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items: {$ref: '#/components/schemas/EventoCluster'}
              example:
                - {ts: '2026-11-19T15:30:04.512-05:00', tipo: alta, nodo: H45-022,
                   detalle: '10.11.38.69:56455: 24 workers, latencia 0.49 ms'}
                - {ts: '2026-11-19T15:30:02.118-05:00', tipo: baja, nodo: H45-022,
                   detalle: '10.11.38.69:56431: entrenamiento e-20261119-1530 terminado'}
        '400':
          description: limite no es un entero entre 1 y 200
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: limite tiene que ser un entero entre 1 y 200}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/SinPermiso'}
        '503': {$ref: '#/components/responses/NoDisponible'}
  /api/entrenamientos:
    post:
      tags: [Entrenamientos]
      operationId: iniciarEntrenamiento
      summary: Inicia un entrenamiento distribuido de forma asíncrona
      description: |
        Rol admin. Solo se permite un entrenamiento a la vez: un segundo pedido
        mientras corre el primero recibe 409 con el id del que está en curso.
        No hay clave de idempotencia: un pedido repetido después de que el
        primero terminó lanza otro entrenamiento.

        Si replicas es mayor que 1, la corrida es una medición y no reemplaza el
        modelo activo. Con replicas = 1 y si termina bien, el modelo nuevo pasa
        a ser el activo con el id entrenado-{id} (modelo_id), salvo que
        dif_secuencial supere 1e-9: dentro de esa tolerancia la diferencia con
        el K-Means secuencial es redondeo; fuera, los centroides son otros
        (algún nodo devolvió parciales que no corresponden a sus filas). En ese
        caso el entrenamiento queda terminado, pero no activa su modelo y lo
        dice en aviso.

        El id es e-AAAAMMDD-HHMM en la hora de Lima, con un sufijo (-2, -3…)
        si en ese minuto ya hubo otro. Al terminar, los nodos vuelven a llamar
        a la API después de su pausa entre intentos (unos 2 s): un pedido
        inmediato puede recibir 422.
        Si cae un nodo, el entrenamiento queda abortado con el nombre del nodo en
        error y no activa ningún modelo.
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PedidoEntrenamiento'}
            example: {nodos: 4, replicas: 1, semilla: 42}
      responses:
        '202':
          description: Pedido aceptado; consultar el id para seguir el resultado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EntrenamientoAceptado'}
              example: {id: e-20261119-1530, estado: en_curso}
        '400': {$ref: '#/components/responses/PedidoInvalido'}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/SinPermiso'}
        '409':
          description: Ya hay un entrenamiento en curso
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: 'ya hay un entrenamiento en curso: e-20261119-1528'}
        '422':
          description: No hay suficientes nodos libres para el pedido
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: hay 2 nodos libres en el pool y se pidieron 4}
        '503':
          description: La API arrancó sin el gold y no puede entrenar, se está apagando, o no responde MongoDB
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: 'esta API no puede entrenar: arrancó sin el gold (-gold)'}
    get:
      tags: [Entrenamientos]
      operationId: listarEntrenamientos
      summary: Lista el historial de entrenamientos, sin las rondas
      description: Las rondas de cada entrenamiento se piden con GET /api/entrenamientos/{id}.
      x-roles: [admin]
      responses:
        '200':
          description: Historial, del más reciente al más antiguo; una lista vacía es válida
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/EntrenamientoResumen'}
              example:
                - id: e-20261119-1540
                  estado: abortado
                  nodos: [H45-022, H45-023]
                  replicas: 1
                  error: 'ronda 1: el nodo H45-023 no respondió dentro del plazo'
                - id: e-20261119-1530
                  estado: terminado
                  nodos: [H45-022, H45-023, H45-024, H45-032]
                  replicas: 1
                  iteraciones: 44
                  paro: tolerancia
                  dif_secuencial: 8.9e-16
                  ms_total: 31.2
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/SinPermiso'}
        '503': {$ref: '#/components/responses/NoDisponible'}
  /api/entrenamientos/{id}:
    parameters:
      - $ref: '#/components/parameters/EntrenamientoId'
    get:
      tags: [Entrenamientos]
      operationId: consultarEntrenamiento
      summary: Consulta un entrenamiento con sus rondas o el error de aborto
      x-roles: [admin]
      responses:
        '200':
          description: Estado y rondas disponibles hasta el momento
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Entrenamiento'}
              examples:
                en_curso:
                  value:
                    id: e-20261119-1530
                    estado: en_curso
                    nodos: [H45-022, H45-023, H45-024, H45-032]
                    replicas: 1
                    rondas:
                      - iter: 1
                        inercia: 73075.5
                        ms_ronda: 0.61
                        ms_fusion: 0.003
                        ms_por_nodo: {H45-022: 0.11, H45-023: 0.12, H45-024: 0.11, H45-032: 0.13}
                terminado:
                  value:
                    id: e-20261119-1530
                    estado: terminado
                    nodos: [H45-022, H45-023, H45-024, H45-032]
                    replicas: 1
                    iteraciones: 44
                    paro: tolerancia
                    dif_secuencial: 8.9e-16
                    ms_total: 31.2
                    rondas:
                      - iter: 1
                        inercia: 73075.5
                        ms_ronda: 0.61
                        ms_fusion: 0.003
                        ms_por_nodo: {H45-022: 0.11, H45-023: 0.12, H45-024: 0.11, H45-032: 0.13}
                abortado:
                  value:
                    id: e-20261119-1540
                    estado: abortado
                    nodos: [H45-022, H45-023]
                    replicas: 1
                    rondas: []
                    error: 'ronda 1: el nodo H45-023 no respondió dentro del plazo'
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/SinPermiso'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
        '503': {$ref: '#/components/responses/NoDisponible'}
  /api/metricas:
    get:
      tags: [Métricas]
      operationId: consultarMetricas
      summary: Consulta pedidos, percentiles de latencia, CPU y memoria de la API y estado del clúster
      x-roles: [admin]
      responses:
        '200':
          description: Percentiles en milisegundos por endpoint
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Metricas'}
              example:
                endpoints:
                  POST /api/predicciones: {pedidos: 12000, p50_ms: 0.3, p95_ms: 0.9, p99_ms: 2.1}
                nodos_en_pool: 4
                ultimo_entrenamiento: e-20261119-1530
                escrituras_descartadas: 0
                escrituras_fallidas: 0
                escritura:
                  mongo: {escritas: 12000, descartadas: 0, fallidas: 0, lotes: 3120}
                  redis: {escritas: 12000, descartadas: 0, fallidas: 0, lotes: 3050}
                puntos_de_control: {escritos: 44, fallidos: 0, omitidos: 0}
                proceso_api: {cpu_usuario_s: 12.48, cpu_sistema_s: 3.105, en_marcha_s: 1824.6, nucleos: 8,
                              heap_mb: 21.7, sistema_mb: 48.3, max_rss_mb: 63.9, goroutines: 27}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/SinPermiso'}
  /openapi.yaml:
    get:
      tags: [Documentación]
      operationId: descargarOpenAPI
      summary: Sirve este contrato OpenAPI sin transformación
      security: []
      responses:
        '200':
          description: Documento YAML OpenAPI 3.0.3
          content:
            application/yaml:
              schema: {type: string}
  /docs:
    get:
      tags: [Documentación]
      operationId: consultarSwaggerUI
      summary: Muestra Swagger UI con el contrato de /openapi.yaml
      security: []
      responses:
        '200':
          description: Página HTML de Swagger UI
          content:
            text/html:
              schema: {type: string}
  /ws:
    get:
      tags: [Eventos]
      operationId: seguirEventos
      summary: Abre un WebSocket con el estado de las estaciones y los eventos del entrenamiento
      description: |
        Rol usuario o admin. Solo el servidor envía. Cada trama de texto es un
        objeto JSON con el nombre del evento y sus datos (esquema EventoWS):
        {"evento": "estacion.regimen", "datos": {...}}.

        Qué eventos ve cada rol: estacion.regimen llega a todos, usuario y
        admin. entrenamiento.ronda y entrenamiento.fin llegan solo a los
        clientes con rol admin (los entrenamientos son de admin).

        estacion.regimen es el tiempo real del panel: el estado nuevo de una
        estación (esquema EstadoEstacion, el mismo objeto de cada entrada de
        GET /api/regimenes). Dos reglas:
        - Sale solo cuando esa lectura pasó a ser el estado de la estación, es
          decir, cuando la escritura en Redis reemplazó al guardado. Una
          lectura más antigua que la guardada se predice y se responde igual,
          pero no cambia el estado ni emite evento: el evento y
          GET /api/regimenes dicen siempre lo mismo. Sale después de la
          escritura, así que quien lo recibe puede pedir el GET en el acto.
        - Va agrupado por estación: de una misma estación sale a lo sumo un
          evento cada 250 ms. El primero sale enseguida; si en ese intervalo la
          estación cambia varias veces (una ráfaga de lecturas), al cumplirse
          sale solo el último estado. Los intermedios no se envían: el evento
          es el estado, no cada lectura.

        Cómo se junta con GET /api/regimenes. Para no perder cambios, el
        cliente abre primero el WebSocket y después pide el GET; al reconectar,
        lo vuelve a pedir. Pero el GET y los eventos viajan por conexiones
        distintas: la respuesta del GET puede llegar después de un evento más
        nuevo de la misma estación, y aplicarla tal cual lo pisaría con un
        estado viejo. La regla:
        - De una estación de la que el cliente ya recibió un evento desde que
          abrió este WebSocket, la entrada del GET se ignora: el evento manda.
          No se pierde nada, porque si el GET traía un estado más nuevo que
          ese evento, su propio evento llega después.
        - De las demás estaciones, se toma la entrada del GET.
        - Al reconectar, la cuenta empieza de nuevo: solo valen los eventos
          recibidos por la conexión nueva.
        No sirve comparar el GET con el evento por sus campos: ts va al
        segundo, y una lectura corregida de la misma hora conserva fecha_hora.
        Dos eventos de una misma estación, en cambio, llegan siempre en orden:
        el último recibido es el estado.

        Si Redis guarda un estado y su respuesta no le llega a la API, el
        evento no se pierde: sale en cuanto Redis vuelve a responder (hasta
        alrededor de un segundo después). Ese caso puede repetir un evento con
        un estado que el cliente ya tenía; aplicarlo otra vez no cambia nada.

        El JWT se acepta de tres maneras, en este orden:
        - Authorization: Bearer, como en el resto de la API, para un cliente
          que puede poner encabezados (Postman, curl, otro servicio).
        - Sec-WebSocket-Protocol: el subprotocolo aire.jwt seguido del token.
          Es lo recomendado para el navegador, que no deja poner Authorization:
          new WebSocket(url, ["aire.jwt", token]). El token no queda en la URL
          (historial, logs de un proxy). El 101 confirma aire.jwt.
        - La consulta token (?token=…), para probar a mano. La API no escribe
          la consulta en su log.

        Si el pedido trae Origin, tiene que ser el mismo host de la API o un
        origen permitido en el servidor (CORS_ORIGENES); si no, 403. El servidor
        manda un ping cada 30 s y cierra con 1008 al cliente que no lee al ritmo
        de los eventos o cuyo token venció, y con 1001 al apagarse.
      security:
        - wsSubprotocolo: []
        - wsToken: []
        - bearerAuth: []
      x-roles: [usuario, admin]
      x-websocket-events:
        estacion.regimen:
          schema: {$ref: '#/components/schemas/EventoWS'}
          x-roles: [usuario, admin]
          example:
            evento: estacion.regimen
            datos: {estacion: CA-AYAS-01, fecha_hora: '2026-11-14T15:00:00-05:00', regimen: 1, excede_eca: true,
                    media_24h: {pm2_5: 58.3, pm10: 121.4, lecturas: 24},
                    alerta: true, inca: mala, ts: '2026-11-14T15:00:02-05:00'}
        entrenamiento.ronda:
          schema: {$ref: '#/components/schemas/EventoWS'}
          x-roles: [admin]
          example:
            evento: entrenamiento.ronda
            datos: {id: e-20261119-1530, iter: 1, inercia: 73075.5, ms_ronda: 0.61, ms_fusion: 0.003,
                    ms_por_nodo: {H45-022: 0.11, H45-023: 0.12}}
        entrenamiento.fin:
          schema: {$ref: '#/components/schemas/EventoWS'}
          x-roles: [admin]
          examples:
            terminado:
              evento: entrenamiento.fin
              datos: {id: e-20261119-1530, iteraciones: 44, paro: tolerancia, dif_secuencial: 8.9e-16, ms_total: 31.2}
            abortado:
              evento: entrenamiento.fin
              datos: {id: e-20261119-1540, error: 'ronda 1: el nodo H45-023 no respondió dentro del plazo'}
      responses:
        '101':
          description: Conexión actualizada a WebSocket; a partir de aquí se reciben tramas de texto
          headers:
            Sec-WebSocket-Protocol:
              description: aire.jwt, si el cliente lo ofreció. Nunca el token.
              schema: {type: string, enum: [aire.jwt]}
            Upgrade:
              schema: {type: string, enum: [websocket]}
            Connection:
              schema: {type: string, example: Upgrade}
            Sec-WebSocket-Accept:
              schema: {type: string}
        '400': {$ref: '#/components/responses/PedidoInvalido'}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403':
          description: El Origin del pedido no es el de la API ni uno permitido
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: 'el origen http://otro.example no puede abrir este WebSocket'}
        '503':
          description: La API se está apagando
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: la API se está apagando}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT HS256 en Authorization. Los roles usuario/admin se comprueban en el servidor; x-roles documenta el acceso.
    wsToken:
      type: apiKey
      in: query
      name: token
      description: El mismo JWT HS256 en la consulta del handshake WebSocket. No registrar la consulta en logs.
    wsSubprotocolo:
      type: apiKey
      in: header
      name: Sec-WebSocket-Protocol
      description: |
        El mismo JWT HS256 como subprotocolo del handshake WebSocket: «aire.jwt, <token>». Es lo
        recomendado para el navegador: new WebSocket(url, ["aire.jwt", token]).
  parameters:
    EstacionId:
      name: id
      in: path
      required: true
      description: Código de la estación OEFA
      schema: {type: string, minLength: 1}
      example: CA-AYAS-01
    EntrenamientoId:
      name: id
      in: path
      required: true
      description: Identificador devuelto al iniciar el entrenamiento
      schema: {type: string, minLength: 1}
      example: e-20261119-1530
  responses:
    PedidoInvalido:
      description: JSON o parámetros inválidos
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: pedido inválido}
    NoAutenticado:
      description: Falta el JWT, es inválido o expiró
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: 'token ausente, inválido o expirado'}
    SinPermiso:
      description: El JWT es válido pero el rol no autoriza la operación
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: se requiere el rol admin}
    NoEncontrado:
      description: No existe el recurso
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: 'no existe el entrenamiento e-20261119-9999'}
    NoDisponible:
      description: El almacén que atiende la ruta (MongoDB o Redis) no responde
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: MongoDB no disponible}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string, minLength: 1}
    Credenciales:
      type: object
      required: [usuario, clave]
      properties:
        usuario: {type: string, minLength: 1}
        clave: {type: string, minLength: 1, format: password, writeOnly: true}
    Token:
      type: object
      required: [token, rol, expira]
      properties:
        token: {type: string, minLength: 1}
        rol: {type: string, enum: [usuario, admin]}
        expira: {type: string, format: date-time}
    Salud:
      type: object
      required: [api, mongo, redis, nodos_en_pool, modelo_activo]
      properties:
        api: {type: string, enum: [ok]}
        mongo: {type: string, enum: [ok, error]}
        redis: {type: string, enum: [ok, error]}
        nodos_en_pool: {type: integer, minimum: 0}
        modelo_activo: {type: string, nullable: true}
    Lectura:
      type: object
      required: [estacion, fecha_hora, pm2_5, pm10]
      properties:
        estacion: {type: string, minLength: 1, maxLength: 64, description: Código de una estación del catálogo}
        fecha_hora:
          type: string
          format: date-time
          description: |
            Fecha RFC3339 con zona explícita; los ejemplos usan America/Lima (UTC-5).
            Se trunca a la hora. Se aceptan fechas históricas y lecturas desordenadas, pero no
            una fecha más de 1 hora adelante del reloj del servidor.
        pm2_5: {type: number, format: double, minimum: 0, maximum: 10000, description: Concentración de PM2.5 en µg/m³}
        pm10: {type: number, format: double, minimum: 0, maximum: 10000, description: Concentración de PM10 en µg/m³}
    Prediccion:
      type: object
      required: [estacion, regimen, excede_eca, media_24h, alerta, inca, pm2_5_medio_regimen, pm10_medio_regimen, modelo_id, ms]
      properties:
        estacion: {type: string, minLength: 1}
        regimen: {type: integer, minimum: 0}
        excede_eca: {type: boolean, description: 'Si la media del régimen supera el ECA; describe el régimen, no la estación'}
        media_24h: {$ref: '#/components/schemas/Media24h'}
        alerta: {$ref: '#/components/schemas/Alerta'}
        inca: {$ref: '#/components/schemas/BandaINCA'}
        pm2_5_medio_regimen: {type: number, minimum: 0, description: Media horaria del régimen en µg/m³}
        pm10_medio_regimen: {type: number, minimum: 0, description: Media horaria del régimen en µg/m³}
        modelo_id: {type: string, minLength: 1}
        ms: {type: number, minimum: 0, description: Tiempo interno de predicción en milisegundos}
    Estacion:
      type: object
      required: [id, objeto_fiscalizado, tipo_actividad, departamento, provincia, distrito, lat, lon]
      description: |
        Documento de la colección estaciones (spec §7.1), sembrado desde
        reports/estaciones_ficha.csv; id es su _id, el código OEFA. Las 33
        estaciones tienen coordenadas; un campo que falte en la fuente llega como null.
      properties:
        id: {type: string, minLength: 1}
        objeto_fiscalizado: {type: string, nullable: true}
        tipo_actividad: {type: string, nullable: true}
        departamento: {type: string, nullable: true}
        provincia: {type: string, nullable: true}
        distrito: {type: string, nullable: true}
        lat: {type: number, minimum: -90, maximum: 90}
        lon: {type: number, minimum: -180, maximum: 180}
    RegimenEstacion:
      type: object
      required: [fecha_hora, regimen, excede_eca, media_24h, alerta, inca, ts]
      description: |
        El estado de la estación en su lectura más reciente por fecha_hora. Una
        lectura más antigua que la guardada no lo reemplaza.
      properties:
        fecha_hora: {type: string, format: date-time, description: La hora de la lectura a la que corresponde}
        regimen: {type: integer, minimum: 0}
        excede_eca: {type: boolean}
        media_24h: {$ref: '#/components/schemas/Media24h'}
        alerta: {$ref: '#/components/schemas/Alerta'}
        inca: {$ref: '#/components/schemas/BandaINCA'}
        ts: {type: string, format: date-time}
    EstadoEstacion:
      description: |
        El RegimenEstacion de una estación junto con su código. Es cada entrada de
        GET /api/regimenes y los datos del evento estacion.regimen de /ws.
      allOf:
        - $ref: '#/components/schemas/RegimenEstacion'
        - type: object
          required: [estacion]
          properties:
            estacion: {type: string, minLength: 1, description: Código de la estación OEFA}
    Media24h:
      type: object
      required: [pm2_5, pm10, lecturas]
      description: |
        Media de las lecturas de la estación con fecha_hora en (t − 24 h, t], donde t es la
        fecha_hora de la lectura, truncada a la hora. La API lleva en memoria, por estación,
        las 72 lecturas horarias más cercanas a la última recibida: una fecha lejana no
        borra las demás. Con menos de 18 lecturas en la ventana, pm2_5 y pm10 son null.
      properties:
        pm2_5: {type: number, minimum: 0, nullable: true}
        pm10: {type: number, minimum: 0, nullable: true}
        lecturas: {type: integer, minimum: 0, maximum: 24}
    Alerta:
      type: boolean
      description: |
        La media de 24 h de la estación supera el ECA (DS 003-2017-MINAM): PM2.5 > 50 µg/m³
        o PM10 > 100 µg/m³. Es false mientras la ventana tenga menos de 18 lecturas. No
        depende del régimen.
    BandaINCA:
      type: string
      nullable: true
      enum: [buena, moderada, mala, umbral_de_cuidado, null]
      description: |
        Banda del INCA (RM 181-2016-MINAM, tabla 3) de la media de 24 h; la peor entre
        PM10 (≤ 75, ≤ 150, ≤ 250, > 250 µg/m³) y PM2.5 (≤ 12.5, ≤ 25, ≤ 125, > 125 µg/m³).
        Se informa aparte del ECA: no se mezclan. null con menos de 18 lecturas.
    RegimenModelo:
      type: object
      required: [regimen, pm2_5_medio, pm10_medio, excede_eca, tamano]
      properties:
        regimen: {type: integer, minimum: 0}
        pm2_5_medio: {type: number, minimum: 0}
        pm10_medio: {type: number, minimum: 0}
        excede_eca: {type: boolean}
        tamano: {type: integer, minimum: 0}
    Modelo:
      type: object
      required: [id, k, features, iteraciones, inercia, regimenes]
      properties:
        id: {type: string, minLength: 1}
        k: {type: integer, minimum: 1}
        features:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string}
        iteraciones: {type: integer, minimum: 0}
        inercia: {type: number, minimum: 0}
        centroides:
          type: array
          description: Centroides en unidades originales y en el orden de features, si el servidor los incluye.
          items:
            type: array
            items: {type: number}
        regimenes:
          type: array
          items: {$ref: '#/components/schemas/RegimenModelo'}
    Nodo:
      type: object
      required: [nombre, direccion, workers, latencia_ms, libre]
      properties:
        nombre: {type: string, minLength: 1}
        direccion: {type: string, description: Dirección TCP remota observada por el coordinador}
        workers: {type: integer, minimum: 1}
        latencia_ms: {type: number, minimum: 0}
        libre: {type: boolean}
    EventoCluster:
      type: object
      required: [ts, tipo, nodo, detalle]
      description: Un documento de eventos_cluster. No es un evento del WebSocket.
      properties:
        ts: {type: string, format: date-time, description: 'Cuándo lo vio el coordinador, en la hora de Lima y al milisegundo'}
        tipo:
          type: string
          enum: [alta, baja, error]
          description: 'alta: el nodo entró al pool; baja: salió; error: no llegó a entrar o hizo abortar una corrida'
        nodo: {type: string, description: Nombre con que el nodo se presentó}
        detalle: {type: string, description: 'La dirección TCP del nodo y lo que pasó, en texto'}
    PedidoEntrenamiento:
      type: object
      required: [nodos, replicas, semilla]
      properties:
        nodos: {type: integer, minimum: 1}
        replicas:
          type: integer
          minimum: 1
          description: Si supera 1, la corrida no activa el modelo obtenido.
        semilla: {type: integer, format: int64}
    EntrenamientoAceptado:
      type: object
      required: [id, estado]
      properties:
        id: {type: string, minLength: 1}
        estado: {type: string, enum: [en_curso]}
    Ronda:
      type: object
      required: [iter, inercia, ms_ronda, ms_fusion, ms_por_nodo]
      properties:
        iter: {type: integer, minimum: 1}
        inercia: {type: number, minimum: 0}
        ms_ronda: {type: number, minimum: 0}
        ms_fusion: {type: number, minimum: 0}
        ms_por_nodo:
          type: object
          description: Tiempo observado por nodo desde el coordinador, en ms. No es un porcentaje de CPU.
          additionalProperties: {type: number, minimum: 0}
    EntrenamientoResumen:
      type: object
      required: [id, estado, nodos, replicas]
      description: |
        Qué campos trae según el estado: en_curso, solo los de identificación;
        terminado, además iteraciones, paro, dif_secuencial y ms_total, y
        modelo_id si activó su modelo o aviso si tenía que activarlo y no lo
        hizo; abortado, además error.
      properties:
        id: {type: string, minLength: 1}
        estado: {type: string, enum: [en_curso, terminado, abortado]}
        nodos:
          type: array
          items: {type: string}
        replicas: {type: integer, minimum: 1}
        iteraciones: {type: integer, minimum: 0}
        paro: {$ref: '#/components/schemas/Paro'}
        dif_secuencial: {type: number, minimum: 0, description: Mayor diferencia con el K-Means secuencial}
        ms_total: {type: number, minimum: 0}
        modelo_id: {type: string, minLength: 1, description: 'Modelo que este entrenamiento dejó activo; ausente si no activó ninguno'}
        aviso: {type: string, minLength: 1, description: 'Por qué un entrenamiento terminado con replicas = 1 no activó su modelo'}
        error: {type: string, minLength: 1, description: 'Motivo del aborto, con el nodo que falló'}
    Entrenamiento:
      description: El resumen más las rondas completadas hasta el momento.
      allOf:
        - $ref: '#/components/schemas/EntrenamientoResumen'
        - type: object
          required: [rondas]
          properties:
            rondas:
              type: array
              items: {$ref: '#/components/schemas/Ronda'}
    Paro:
      type: string
      enum: [tolerancia, max_iter]
      description: Por qué terminó el algoritmo (constantes de kmeans/secuencial.go)
    MetricaEndpoint:
      type: object
      required: [pedidos, p50_ms, p95_ms, p99_ms]
      properties:
        pedidos: {type: integer, minimum: 0}
        p50_ms: {type: number, minimum: 0}
        p95_ms: {type: number, minimum: 0}
        p99_ms: {type: number, minimum: 0}
    EscrituraAlmacen:
      type: object
      required: [escritas, descartadas, fallidas, lotes]
      description: |
        Lo que el escritor de predicciones hizo en un almacén desde que arrancó la API. La
        predicción responde sin esperar al almacén: se encola y una goroutine por almacén la
        escribe por lotes.
      properties:
        escritas: {type: integer, minimum: 0, description: Predicciones en lotes que el almacén aceptó}
        descartadas: {type: integer, minimum: 0, description: 'Predicciones que no se escribieron: la cola estaba llena, o quedaron sin escribir al apagar'}
        fallidas: {type: integer, minimum: 0, description: Predicciones en lotes que el almacén rechazó o no respondió a tiempo}
        lotes: {type: integer, minimum: 0, description: Idas y vueltas al almacén}
    Metricas:
      type: object
      required: [endpoints, nodos_en_pool, ultimo_entrenamiento, escrituras_descartadas, escrituras_fallidas, escritura, puntos_de_control, proceso_api]
      properties:
        endpoints:
          type: object
          additionalProperties: {$ref: '#/components/schemas/MetricaEndpoint'}
        nodos_en_pool: {type: integer, minimum: 0}
        ultimo_entrenamiento: {type: string, nullable: true}
        escrituras_descartadas: {type: integer, minimum: 0, description: 'Descartes al llenarse una cola de persistencia; suma de los dos almacenes'}
        escrituras_fallidas: {type: integer, minimum: 0, description: 'Escrituras que el almacén rechazó; suma de los dos almacenes'}
        escritura:
          type: object
          required: [mongo, redis]
          description: El detalle por almacén.
          properties:
            mongo: {$ref: '#/components/schemas/EscrituraAlmacen'}
            redis: {$ref: '#/components/schemas/EscrituraAlmacen'}
        puntos_de_control:
          type: object
          required: [escritos, fallidos, omitidos]
          description: |
            Los puntos de control de los entrenamientos (la clave entrenamiento:{id}:punto de
            Redis, con la iteración y los centroides de la última ronda completa) desde que
            arrancó la API. Se escribe uno por ronda sin frenar la corrida: si Redis no llega a
            guardar uno antes de la ronda siguiente, se omite, porque solo importa el último.
          properties:
            escritos: {type: integer, minimum: 0, description: Puntos que Redis guardó}
            fallidos: {type: integer, minimum: 0, description: Escrituras que Redis rechazó o no respondió a tiempo}
            omitidos: {type: integer, minimum: 0, description: Puntos reemplazados por el de una ronda posterior antes de escribirse}
        proceso_api: {$ref: '#/components/schemas/ProcesoAPI'}
    ProcesoAPI:
      type: object
      required: [cpu_usuario_s, cpu_sistema_s, en_marcha_s, nucleos, heap_mb, sistema_mb, max_rss_mb, goroutines]
      description: |
        CPU y memoria del proceso de la API, que es el coordinador del clúster, medidos
        en el momento de la consulta. No son de los nodos: el protocolo del clúster no
        transporta el CPU de cada nodo. De un nodo se conoce lo que tardó en responder
        cada ronda (ms_por_nodo, que incluye la red) y la latencia de su latido
        (latencia_ms en GET /api/cluster/nodos).

        El tiempo de CPU es acumulado desde que arrancó el proceso, no un porcentaje. El
        uso de CPU entre dos consultas es
        (Δcpu_usuario_s + Δcpu_sistema_s) / Δen_marcha_s: 1 es un núcleo ocupado todo ese
        tiempo y el tope es nucleos. Con una sola consulta, el mismo cociente sin las
        diferencias es el promedio desde el arranque.
      properties:
        cpu_usuario_s: {type: number, minimum: 0, description: Segundos de CPU en modo usuario que el proceso consumió desde que arrancó}
        cpu_sistema_s: {type: number, minimum: 0, description: Segundos de CPU en modo núcleo que el proceso consumió desde que arrancó}
        en_marcha_s: {type: number, minimum: 0, description: Segundos de reloj desde que arrancó el proceso}
        nucleos: {type: integer, minimum: 1, description: 'Núcleos que el proceso puede usar a la vez (GOMAXPROCS)'}
        heap_mb: {type: number, minimum: 0, description: Memoria viva en el heap de Go ahora}
        sistema_mb: {type: number, minimum: 0, description: Memoria que el runtime de Go tiene pedida al sistema operativo}
        max_rss_mb: {type: number, minimum: 0, description: 'Máximo de memoria residente del proceso desde que arrancó; no baja'}
        goroutines: {type: integer, minimum: 1, description: Goroutines vivas ahora}
        no_disponible:
          type: array
          items: {type: string, enum: [cpu_usuario_s, cpu_sistema_s, max_rss_mb]}
          description: |
            Los campos que esta plataforma no puede medir y quedaron en 0. Solo aparece
            cuando hay alguno: en Windows, el tiempo de CPU y el máximo de memoria
            residente. En Linux (la imagen de Docker) se mide todo.
    EventoRonda:
      allOf:
        - $ref: '#/components/schemas/Ronda'
        - type: object
          required: [id]
          properties:
            id: {type: string, minLength: 1}
    EventoFin:
      type: object
      required: [id, iteraciones, paro, dif_secuencial, ms_total]
      properties:
        id: {type: string, minLength: 1}
        iteraciones: {type: integer, minimum: 0}
        paro: {$ref: '#/components/schemas/Paro'}
        dif_secuencial: {type: number, minimum: 0}
        ms_total: {type: number, minimum: 0}
        modelo_id: {type: string, minLength: 1, description: 'Como en EntrenamientoResumen'}
        aviso: {type: string, minLength: 1, description: 'Como en EntrenamientoResumen'}
    EventoError:
      type: object
      required: [id, error]
      properties:
        id: {type: string, minLength: 1}
        error: {type: string, minLength: 1}
    EventoWS:
      type: object
      required: [evento, datos]
      description: Una trama de texto del WebSocket.
      properties:
        evento: {type: string, enum: [estacion.regimen, entrenamiento.ronda, entrenamiento.fin]}
        datos:
          description: |
            EstadoEstacion con estacion.regimen; EventoRonda con entrenamiento.ronda;
            EventoFin o EventoError con entrenamiento.fin.
          oneOf:
            - $ref: '#/components/schemas/EstadoEstacion'
            - $ref: '#/components/schemas/EventoRonda'
            - $ref: '#/components/schemas/EventoFin'
            - $ref: '#/components/schemas/EventoError'
