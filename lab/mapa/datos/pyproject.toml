[project]
name = "mapa-datos"
version = "0.1.0"
description = "Datos del mapa nacional de PM2.5 y PM10: descarga, regrillado, días normalizados, estáticos, etiquetas y manifiesto"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cdsapi>=0.7.4",
    "netcdf4>=1.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "rasterio>=1.3",
    "xarray>=2024.6",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
